; ESP32 / ESP32-S3 (M5Stack) TOPS ベンチマーク: PIE あり (S3) / なし
; 公式 espressif32 は arduino-esp32 2.0.x で止まっているため pioarduino (arduino-esp32 3.x / gcc 14) を使う
[platformio]
default_envs = m5stack-cores3, m5stack-core2, m5stack-tab5

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
lib_deps =
    m5stack/M5Unified@^0.2.22
upload_speed = 921600
monitor_speed = 115200

; ---- M5Stack CoreS3 (ESP32-S3): PIE SIMD あり ----
[env:m5stack-cores3]
board = m5stack-cores3
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi   ; CoreS3 の PSRAM は quad-SPI
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; ---- M5Stack Core / Core2 / Fire (無印 ESP32, 16MB flash): PIE なし ----
; M5Unified が機種を自動判別する。PSRAM の無い機種では PSRAM 行をスキップする
[env:m5stack-core2]
board = m5stack-core2
board_build.partitions = default_16MB.csv
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; ---- M5Stack Tab5 (ESP32-P4, RISC-V, 16MB flash, 32MB PSRAM): PIE SIMD あり (esp.* 命令) ----
[env:m5stack-tab5]
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
